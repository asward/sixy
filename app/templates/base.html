<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sixy</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mut:#6b7385;--line:#e3e6ec;--ok:#1f8a4c;--okbg:#e6f5ec;--bad:#c0362c;--badbg:#fbe9e7;--warn:#a86400;--warnbg:#fff4df;--acc:#2b59c3}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b1f27;--fg:#e6e8ee;--mut:#9099ab;--line:#2b313d;--okbg:#15301f;--badbg:#3a1b18;--warnbg:#36290f;--acc:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-size:17px}header nav{display:flex;gap:14px;margin-left:auto}a{color:var(--acc);text-decoration:none}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase}
.mut{color:var(--mut)}.small{font-size:13px}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.r-critical{background:var(--badbg);color:var(--bad)}.r-high{background:var(--warnbg);color:var(--warn)}
.r-medium{background:var(--line);color:var(--fg)}.r-low,.r-ok{background:var(--okbg);color:var(--ok)}.r-unknown{background:var(--line);color:var(--mut)}
.r-alert,.r-error{background:var(--badbg);color:var(--bad)}.r-running{background:var(--warnbg);color:var(--warn)}
.hero{display:flex;flex-wrap:wrap;gap:18px;align-items:center}.hero .big{font-size:26px;font-weight:700}
.hero.ok{border-left:5px solid var(--ok)}.hero.alert,.hero.error{border-left:5px solid var(--bad)}.hero.none{border-left:5px solid var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;flex:1}
.stat .k{font-size:12px;color:var(--mut);text-transform:uppercase}.stat .v{font-weight:600}
button,.btn{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;cursor:pointer}
button.sec{background:var(--line);color:var(--fg)}button:disabled{opacity:.5}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
label{display:block;font-weight:600;margin:12px 0 4px}.help{font-size:13px;color:var(--mut);margin-top:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.row{grid-template-columns:1fr}td.hide-sm,th.hide-sm{display:none}}
.flash{padding:10px 14px;border-radius:8px;margin-bottom:12px}.flash.ok{background:var(--okbg)}.flash.err{background:var(--badbg)}.flash.warn{background:var(--warnbg)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:12.5px}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}.chk input{width:auto}
.dim td{opacity:.65}.card{overflow-wrap:anywhere}
</style>
</head>
<body>
<header><b>Sixy</b>{% if backend=='demo' %}<span class="pill r-high">DEMO MODE</span>{% endif %}
<nav><a href="{{ url_for('index') }}">Dashboard</a><a href="{{ url_for('settings') }}">Settings</a></nav></header>
<main>
{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>
